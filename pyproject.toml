[project]
name = "poldoma"
version = "0.1.0"
description = "Автоматизация информирования о новых судебных делах (КАД) и передача обращений в Bitrix24"
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=3.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "asyncpg>=0.29",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "playwright>=1.45",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
