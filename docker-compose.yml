services:
  db:
    image: postgres:16-alpine
    container_name: poldoma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан в .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    ports:
      - "5434:5432"
    volumes:
      - poldoma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: poldoma_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Вся конфигурация (KAD_*, SMTP_*, SCHEDULER_*) берётся из .env
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    ports:
      - "8000:8000"
    # Один контейнер = один процесс = один планировщик. Реплики/воркеры
    # запрещены (см. комментарий в Dockerfile к --workers 1).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if b'healthy' in urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./data/reports:/app/data/reports

volumes:
  poldoma_pgdata:

