services:
  db:
    image: postgres:16-alpine
    container_name: poldoma_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poldoma}
      POSTGRES_USER: ${POSTGRES_USER:-poldoma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poldoma_pass}
    ports:
      - "5434:5432"
    volumes:
      - poldoma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poldoma_user} -d ${POSTGRES_DB:-poldoma}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  poldoma_pgdata:

